name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "minimal"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4
      # --- FULLY AUTOMATIC CACHE ---
      - name: Cache Build Objects
        uses: actions/cache@v4
        with:
          path: |
            build
            out
          # The 'run_id' makes this key unique every single time you push
          key: ${{ runner.os }}-${{ matrix.config.target }}-${{ github.run_id }}
          # This tells GitHub: "If you don't find the 'run_id' key (which you won't), 
          # just grab the most recent cache from this OS and Target."
          restore-keys: |
            ${{ runner.os }}-${{ matrix.config.target }}-
      # --- END CACHE ---

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.config.target }}
          bindings: geode-sdk/bindings
          build-config: ${{ matrix.config.build-type || 'Release' }}
          export-pdb: true
          bindings-ref: main
          combine: true

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
